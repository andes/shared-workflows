name: Release

# Dispara el release con el workflow de este mismo commit.
# La llamada andes/shared-workflows/.github/workflows/semantic-release.yml@v1 queda para después.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: ./.github/workflows/semantic-release.yml
    with:
      branches: "['main']"
      floating_tag: true
