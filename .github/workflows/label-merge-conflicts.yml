name: Label merge conflicts

# El caller tiene que dispararlo con pull_request_target (opened, synchronize, reopened).
# Sin checkout del head: el token de ese evento puede escribir en el repositorio base.
on:
  workflow_call:
    inputs:
      label:
        description: Label applied while the pull request has merge conflicts
        required: false
        type: string
        default: Conflictos

permissions:
  contents: read
  pull-requests: write

jobs:
  conflicts:
    runs-on: ubuntu-26.04
    steps:
      - name: Label merge conflicts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CONFLICT_LABEL: ${{ inputs.label }}
        with:
          script: |
            const label = process.env.CONFLICT_LABEL;
            if (!label) {
              throw new Error('Input "label" must be a non-empty string.');
            }

            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              throw new Error(
                "Call this workflow from pull_request_target (opened, synchronize, reopened)."
              );
            }

            const { owner, repo } = context.repo;
            const issue_number = pullRequest.number;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const maxAttempts = 12;
            const delayMs = 5000;

            let mergeableState;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issue_number,
              });
              mergeableState = data.mergeable_state;
              const pending = mergeableState == null || mergeableState === "unknown";

              if (!pending) {
                break;
              }

              if (attempt === maxAttempts) {
                throw new Error(
                  `GitHub did not finish computing mergeable_state for #${issue_number} (last value: ${mergeableState}).`
                );
              }

              core.info(
                `mergeable_state for #${issue_number} is ${mergeableState}; waiting (${attempt}/${maxAttempts}).`
              );
              await sleep(delayMs);
            }

            if (mergeableState === "dirty") {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [label],
              });
              core.info(`Added label "${label}" to #${issue_number}.`);
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: label,
              });
              core.info(`Removed label "${label}" from #${issue_number}.`);
            } catch (error) {
              const status = error.status ?? error.response?.status;
              if (status !== 404) {
                throw error;
              }
            }
