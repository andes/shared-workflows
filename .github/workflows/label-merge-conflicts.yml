name: Label merge conflicts

# El caller lo dispara con pull_request_target (opened, synchronize, reopened) y,
# para re-chequear cuando avanza la rama base, con push a esa rama.
# Sin checkout del head: el token de pull_request_target puede escribir en el repo base.
on:
  workflow_call:
    inputs:
      label:
        description: Label applied while the pull request has merge conflicts
        required: false
        type: string
        default: Conflictos

permissions:
  contents: read
  pull-requests: write

jobs:
  conflicts:
    runs-on: ubuntu-26.04
    steps:
      - name: Label merge conflicts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONFLICT_LABEL: ${{ inputs.label }}
        with:
          script: |
            const label = process.env.CONFLICT_LABEL;
            if (!label) {
              throw new Error('Input "label" must be a non-empty string.');
            }

            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const maxAttempts = 12;
            const delayMs = 5000;

            const getMergeableState = async (pull_number) => {
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number,
                });
                const mergeableState = data.mergeable_state;
                const pending = mergeableState == null || mergeableState === "unknown";

                if (!pending) {
                  return mergeableState;
                }

                if (attempt === maxAttempts) {
                  throw new Error(
                    `GitHub did not finish computing mergeable_state for #${pull_number} (last value: ${mergeableState}).`
                  );
                }

                core.info(
                  `mergeable_state for #${pull_number} is ${mergeableState}; waiting (${attempt}/${maxAttempts}).`
                );
                await sleep(delayMs);
              }
            };

            const syncLabel = async (pull_number) => {
              const mergeableState = await getMergeableState(pull_number);

              if (mergeableState === "dirty") {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: [label],
                });
                core.info(`Added label "${label}" to #${pull_number}.`);
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name: label,
                });
                core.info(`Removed label "${label}" from #${pull_number}.`);
              } catch (error) {
                const status = error.status ?? error.response?.status;
                if (status !== 404) {
                  throw error;
                }
              }
            };

            const pullRequest = context.payload.pull_request;
            if (pullRequest) {
              await syncLabel(pullRequest.number);
              return;
            }

            if (context.eventName !== "push") {
              throw new Error(
                "Call this workflow from pull_request_target (opened, synchronize, reopened) or push to a base branch."
              );
            }

            const ref = context.ref || context.payload.ref;
            if (!ref || !ref.startsWith("refs/heads/")) {
              core.info(`Skipping ${ref || "unknown ref"}: not a branch push.`);
              return;
            }

            const base = ref.slice("refs/heads/".length);
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base,
              per_page: 100,
            });

            core.info(
              `Push to ${base}: re-checking ${pullRequests.length} open pull request(s).`
            );

            const results = await Promise.allSettled(
              pullRequests.map((pr) => syncLabel(pr.number))
            );

            for (const [index, result] of results.entries()) {
              if (result.status === "fulfilled") {
                continue;
              }

              const pull_number = pullRequests[index].number;
              const error = result.reason;
              const status = error?.status ?? error?.response?.status;

              if (status === 401 || status === 403 || status === 422) {
                throw error;
              }

              if (status === 404) {
                core.info(`Skipping #${pull_number}: it is no longer available.`);
                continue;
              }

              core.warning(
                `Could not update #${pull_number}: ${error?.message ?? String(error)}`
              );
            }
