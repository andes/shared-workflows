name: Label changes requested and approved

# El caller lo dispara con pull_request_review (submitted, edited, dismissed).
# Sin checkout del head: solo consulta la API de reviews y labels.
on:
  workflow_call:
    inputs:
      changes_requested_label:
        description: Label applied while the latest review per user requests changes
        required: false
        type: string
        default: Cambio Requerido
      approved_label:
        description: Label applied when the pull request has the required approvals
        required: false
        type: string
        default: Aprobado
      in_progress_label:
        description: Label that blocks the approved label while it is present
        required: false
        type: string
        default: En desarrollo
      min_approvals:
        description: Number of distinct approvals required to apply the approved label
        required: false
        type: number
        default: 2

permissions:
  contents: read
  pull-requests: write

jobs:
  changes-requested:
    runs-on: ubuntu-26.04
    steps:
      - name: Label changes requested and approved
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGES_REQUESTED_LABEL: ${{ inputs.changes_requested_label }}
          APPROVED_LABEL: ${{ inputs.approved_label }}
          IN_PROGRESS_LABEL: ${{ inputs.in_progress_label }}
          MIN_APPROVALS: ${{ inputs.min_approvals }}
        with:
          script: |
            const changesRequestedLabel = process.env.CHANGES_REQUESTED_LABEL;
            const approvedLabel = process.env.APPROVED_LABEL;
            const inProgressLabel = process.env.IN_PROGRESS_LABEL;
            const minApprovals = Number(process.env.MIN_APPROVALS);

            if (!changesRequestedLabel || !approvedLabel || !inProgressLabel) {
              throw new Error('Labels must be non-empty strings.');
            }
            if (!Number.isInteger(minApprovals) || minApprovals < 1) {
              throw new Error('Input "min_approvals" must be a positive integer.');
            }

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (!pr) {
              throw new Error(
                'Call this workflow from pull_request_review (submitted, edited, dismissed).'
              );
            }
            const issue_number = pr.number;

            const reviews = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: issue_number,
            });

            // Última review por usuario: el estado más reciente manda.
            const latestByUser = {};
            for (const r of reviews.data) {
              latestByUser[r.user.login] = r.state;
            }

            const hasChangesRequested = Object.values(latestByUser).includes(
              'CHANGES_REQUESTED'
            );

            const approvals = new Set(
              reviews.data
                .filter((r) => r.state === 'APPROVED')
                .map((r) => r.user.login)
            );

            const labels = pr.labels.map((l) => l.name);

            const removeLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                const status = error.status ?? error.response?.status;
                if (status !== 404) {
                  throw error;
                }
              }
            };

            if (hasChangesRequested) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [changesRequestedLabel],
              });
              core.info(`Added label "${changesRequestedLabel}" to #${issue_number}.`);
              await removeLabel(approvedLabel);
              return;
            }

            await removeLabel(changesRequestedLabel);

            if (approvals.size >= minApprovals && !labels.includes(inProgressLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [approvedLabel],
              });
              core.info(`Added label "${approvedLabel}" to #${issue_number}.`);
            } else {
              await removeLabel(approvedLabel);
            }
