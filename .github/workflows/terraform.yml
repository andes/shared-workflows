name: Terraform

# plan|apply en central-docker. Terraform/SOPS con actions estándar;
# state path e Infisical son lo único andes-específico en bash.
on:
  workflow_call:
    inputs:
      command:
        description: plan o apply.
        required: true
        type: string
      working_directory:
        description: Directorio Terraform relativo al checkout.
        required: true
        type: string
      state_name:
        description: Nombre bajo /opt/andes/terraform-state/<state_name>.
        required: true
        type: string
      terraform_version:
        description: Versión de Terraform.
        required: false
        type: string
        default: "1.17.2"
      infisical_env_file:
        description: Dotenv con INFISICAL_UNIVERSAL_AUTH_*.
        required: true
        type: string
      require_existing_state:
        description: Si true, el tfstate tiene que existir (vsphere).
        required: false
        type: boolean
        default: false
      export_project_id:
        description: Exporta INFISICAL_PROJECT_ID como TF_VAR_infisical_project_id.
        required: false
        type: boolean
        default: true
      install_sops:
        description: Instala sops con nhedger/setup-sops.
        required: false
        type: boolean
        default: false
      sops_version:
        description: Versión de sops.
        required: false
        type: string
        default: "3.13.3"
      pre_script:
        description: Script del caller antes de init. Vacío = skip. Debe escribir exports en GITHUB_ENV.
        required: false
        type: string
        default: ""
      post_apply_script:
        description: Script del caller después de apply. Vacío = skip.
        required: false
        type: string
        default: ""
      post_plan_comment:
        description: Si true y el caller es pull_request, publica el plan como comment sticky en el PR.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on:
      group: central-docker
      labels: [docker-central]
    env:
      TF_IN_AUTOMATION: "1"
      INFISICAL_HOST: https://secrets.andes.gob.ar
      INFISICAL_AUTH_METHOD: universal
    steps:
      - name: Validar command
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          case "${COMMAND}" in
            plan|apply) ;;
            *)
              printf '::error::command inválido: %q. Usá plan o apply.\n' "${COMMAND}"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup SOPS
        if: inputs.install_sops
        uses: nhedger/setup-sops@18e52f363488ed469d2e1855e542a1c651743bba # v3.0.0
        with:
          version: ${{ inputs.sops_version }}
          token: ${{ github.token }}

      - name: Validar state
        env:
          STATE_NAME: ${{ inputs.state_name }}
          REQUIRE_EXISTING_STATE: ${{ inputs.require_existing_state }}
        run: |
          set -euo pipefail
          state_dir="/opt/andes/terraform-state/${STATE_NAME}"
          state_file="${state_dir}/terraform.tfstate"
          if [[ "${REQUIRE_EXISTING_STATE}" == "true" ]]; then
            if [[ ! -s "${state_file}" ]]; then
              echo "ERROR: ${state_file} no existe o está vacío." >&2
              echo "Copiá el terraform.tfstate actual a esa ruta antes del primer plan." >&2
              exit 1
            fi
            if [[ ! -w "${state_file}" ]]; then
              echo "ERROR: dentro del contenedor, ${state_file} no se puede escribir." >&2
              id >&2 || true
              ls -ld /opt/andes /opt/andes/terraform-state "${state_dir}" >&2 || true
              exit 1
            fi
          else
            if [[ ! -d "${state_dir}" || ! -w "${state_dir}" ]]; then
              echo "ERROR: dentro del contenedor, ${state_dir} no existe o no se puede escribir." >&2
              id >&2 || true
              ls -ld /opt/andes /opt/andes/terraform-state "${state_dir}" >&2 || true
              echo "En la VM del runner:" >&2
              echo "  sudo install -d -o runner-deployer -g redtics -m 2770 /opt/andes/terraform-state" >&2
              echo "  sudo install -d -o runner-deployer -g redtics -m 2770 ${state_dir}" >&2
              exit 1
            fi
          fi
          echo "TF_STATE_DIR=${state_dir}" >> "${GITHUB_ENV}"

      - name: Cargar Infisical
        env:
          INFISICAL_ENV_FILE: ${{ inputs.infisical_env_file }}
          EXPORT_PROJECT_ID: ${{ inputs.export_project_id }}
          INSTALL_SOPS: ${{ inputs.install_sops }}
        run: |
          set -euo pipefail
          cred="${INFISICAL_ENV_FILE}"
          if [[ -z "${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}" || -z "${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}" ]]; then
            if [[ ! -r "${cred}" ]]; then
              echo "ERROR: no se puede leer ${cred}" >&2
              exit 1
            fi
            set -a
            # shellcheck disable=SC1090
            source "${cred}"
            set +a
          fi
          : "${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:?falta INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
          : "${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:?falta INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          echo "::add-mask::${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          {
            echo "INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
            echo "INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          } >> "${GITHUB_ENV}"
          if [[ "${EXPORT_PROJECT_ID}" == "true" ]]; then
            : "${INFISICAL_PROJECT_ID:?falta INFISICAL_PROJECT_ID en ${cred}}"
            {
              echo "INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}"
              echo "TF_VAR_infisical_project_id=${INFISICAL_PROJECT_ID}"
            } >> "${GITHUB_ENV}"
          fi
          if [[ "${INSTALL_SOPS}" == "true" && -z "${SOPS_AGE_SSH_PRIVATE_KEY_FILE:-}" ]]; then
            if [[ -r /opt/andes/secrets-manager/id_ed25519 ]]; then
              echo "SOPS_AGE_SSH_PRIVATE_KEY_FILE=/opt/andes/secrets-manager/id_ed25519" >> "${GITHUB_ENV}"
            elif [[ -r /home/runner-deployer/.ssh/id_ed25519 ]]; then
              echo "SOPS_AGE_SSH_PRIVATE_KEY_FILE=/home/runner-deployer/.ssh/id_ed25519" >> "${GITHUB_ENV}"
            else
              echo "ERROR: no se puede leer la privada de runner-deployer para SOPS." >&2
              exit 1
            fi
          fi

      - name: Prep
        if: inputs.pre_script != ''
        env:
          PRE_SCRIPT: ${{ inputs.pre_script }}
        run: bash --noprofile --norc -euo pipefail "${GITHUB_WORKSPACE}/${PRE_SCRIPT}"

      - name: Terraform init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init -input=false -backend-config="path=${TF_STATE_DIR}/terraform.tfstate"

      - name: Terraform plan
        if: inputs.command == 'plan'
        id: plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan | tee "${GITHUB_WORKSPACE}/andes-tf-plan.txt"

      - name: Comment plan on PR
        if: >
          inputs.command == 'plan' &&
          inputs.post_plan_comment &&
          github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_FILE: ${{ github.workspace }}/andes-tf-plan.txt
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- andes-terraform-plan -->"
        run: |
          set -euo pipefail
          if [[ ! -f "${PLAN_FILE}" ]]; then
            echo "ERROR: no hay ${PLAN_FILE}" >&2
            exit 1
          fi
          if ! command -v gh >/dev/null; then
            echo "ERROR: falta gh en el runner" >&2
            exit 1
          fi

          summary="$(grep -E '^Plan: ' "${PLAN_FILE}" | tail -n1 || true)"
          if [[ -z "${summary}" ]]; then
            if grep -q 'No changes' "${PLAN_FILE}"; then
              summary="No changes. Your infrastructure matches the configuration."
            else
              summary="(sin línea Plan: — ver detalle)"
            fi
          fi

          # Límite conservador del body de un issue comment (~65536).
          max=58000
          plan_body="$(cat "${PLAN_FILE}")"
          truncated=0
          if ((${#plan_body} > max)); then
            plan_body="${plan_body:0:max}"
            truncated=1
          fi

          body_file="$(mktemp)"
          {
            printf '%s\n' "${MARKER}"
            printf '## Terraform plan\n\n'
            printf '%s\n\n' "${summary}"
            printf 'Run: %s\n\n' "${RUN_URL}"
            printf '<details>\n<summary>Detalle</summary>\n\n'
            printf '```hcl\n'
            printf '%s\n' "${plan_body}"
            if [[ "${truncated}" == "1" ]]; then
              printf '\n… truncado (%s chars). Ver el log del run.\n' "${max}"
            fi
            printf '```\n\n</details>\n'
          } >"${body_file}"

          existing_id="$(
            MARKER="${MARKER}" gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | .[0] // empty'
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" \
              -F "body=@${body_file}"
            echo "Plan comment actualizado (#${existing_id})"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${body_file}"
            echo "Plan comment creado"
          fi
          rm -f "${body_file}"

      - name: Terraform apply
        if: inputs.command == 'apply'
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -input=false -auto-approve -no-color

      - name: Post apply
        if: inputs.command == 'apply' && inputs.post_apply_script != ''
        env:
          POST_APPLY_SCRIPT: ${{ inputs.post_apply_script }}
        run: bash --noprofile --norc -euo pipefail "${GITHUB_WORKSPACE}/${POST_APPLY_SCRIPT}"
