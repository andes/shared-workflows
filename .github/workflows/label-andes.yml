name: Label Andes linked pull request

# El caller lo dispara con pull_request (opened, edited, synchronize, reopened).
# Sin checkout del head: solo lee el body del pull request y mueve el label.
on:
  workflow_call:
    inputs:
      label:
        description: Label applied while the pull request links to an Andes pull request
        required: false
        type: string
        default: Andes

permissions:
  contents: read
  pull-requests: write

jobs:
  andes-linked:
    runs-on: ubuntu-26.04
    steps:
      - name: Label Andes linked pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ANDES_LABEL: ${{ inputs.label }}
        with:
          script: |
            const label = process.env.ANDES_LABEL;
            if (!label) {
              throw new Error('Input "label" must be a non-empty string.');
            }

            const pr = context.payload.pull_request;
            if (!pr) {
              throw new Error(
                'Call this workflow from pull_request (opened, edited, synchronize, reopened).'
              );
            }

            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            const body = pr.body || '';
            const regex = /https:\/\/github\.com\/andes\/(app|api)\/pull\/\d+/g;
            const linked = regex.test(body);

            if (linked) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [label],
              });
              core.info(`Added label "${label}" to #${issue_number}.`);
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: label,
              });
              core.info(`Removed label "${label}" from #${issue_number}.`);
            } catch (error) {
              const status = error.status ?? error.response?.status;
              if (status !== 404) {
                throw error;
              }
            }
