name: Semantic release

on:
  workflow_call:
    inputs:
      branches:
        description: >
          Ramas de publicación, con la sintaxis de branches de semantic-release.
          Pisa el branches de la config del repo. El default es main.
          api y app publican desde master y tienen que pasar ['master'].
        required: false
        type: string
        default: "['main']"
      skip_npm:
        description: >
          Si es true, no publica en npm y reemplaza los plugins de la config del repo.
          Si es false, usa esos plugins y corre npm ci solo si hay package-lock.json.
        required: false
        type: boolean
        default: true
      dry_run:
        description: Si es true, analiza sin publicar y sin mover el tag flotante.
        required: false
        type: boolean
        default: false
      floating_tag:
        description: >
          Si es true, después de un release estable mueve el tag v<major>.
          Default false. Un prerelease no lo mueve.
        required: false
        type: boolean
        default: false
    secrets:
      release_token:
        description: Token para publicar. Si no se pasa, usa el GITHUB_TOKEN del caller.
        required: false
      npm_token:
        description: Token de npm. Hace falta cuando skip_npm es false y el paquete se publica.
        required: false
    outputs:
      published:
        description: true si publicó un release. Un dry run queda en false.
        value: ${{ jobs.release.outputs.published }}
      version:
        description: Versión publicada, sin la v. Ejemplo 5.148.1.
        value: ${{ jobs.release.outputs.version }}
      sha:
        description: Commit del release.
        value: ${{ jobs.release.outputs.sha }}
      short_sha:
        description: SHA corto del commit del release.
        value: ${{ jobs.release.outputs.short_sha }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-26.04
    outputs:
      published: ${{ steps.published.conclusion == 'success' }}
      version: ${{ steps.published.outputs.version }}
      sha: ${{ steps.published.outputs.sha }}
      short_sha: ${{ steps.published.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Instalar dependencias
        if: inputs.skip_npm == false
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "No hay package-lock.json. Se usa la config del repo sin instalar."
          fi

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          branches: ${{ inputs.branches }}
          skip_npm_plugin: ${{ inputs.skip_npm }}
          dry_run: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.release_token || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.npm_token }}

      - name: Datos del release
        id: published
        if: steps.semantic.outputs.new_release_published == 'true' && inputs.dry_run == false
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          RELEASE_SHA: ${{ steps.semantic.outputs.new_release_git_head }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_VERSION}" || -z "${RELEASE_SHA}" ]]; then
            echo "::error::Faltan la versión o el commit del release."
            exit 1
          fi
          {
            echo "version=${RELEASE_VERSION}"
            echo "sha=${RELEASE_SHA}"
            echo "short_sha=${RELEASE_SHA:0:7}"
          } >> "${GITHUB_OUTPUT}"

      - name: Mover el tag flotante
        if: inputs.floating_tag == true && inputs.dry_run == false && steps.semantic.outputs.new_release_published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_MAJOR: ${{ steps.semantic.outputs.new_release_major_version }}
          RELEASE_SHA: ${{ steps.semantic.outputs.new_release_git_head }}
          RELEASE_CHANNEL: ${{ steps.semantic.outputs.new_release_channel }}
        with:
          github-token: ${{ secrets.release_token || secrets.GITHUB_TOKEN }}
          script: |
            const channel = process.env.RELEASE_CHANNEL;
            if (channel && channel !== "undefined" && channel !== "null") {
              core.info(`Release en el canal ${channel}. El tag flotante queda donde está.`);
              return;
            }

            const major = process.env.RELEASE_MAJOR;
            const sha = process.env.RELEASE_SHA;
            if (!major || !sha) {
              throw new Error("Faltan el major o el commit del release.");
            }

            const tag = `v${major}`;
            const { owner, repo } = context.repo;

            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha,
                force: true,
              });
              core.info(`Tag ${tag} movido a ${sha}.`);
            } catch (error) {
              const status = error.status ?? error.response?.status;
              const message = `${error.message || ""} ${error.response?.data?.message || ""}`;
              const missing = status === 404 || (status === 422 && message.includes("Reference does not exist"));
              if (!missing) {
                throw error;
              }
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
              core.info(`Tag ${tag} creado en ${sha}.`);
            }
