name: Terraform CI
description: >
  Baja Terraform, valida el state dir, carga creds de Infisical y corre plan|apply.
  El prep/post específico de cada repo va por pre_script / post_apply_script.

inputs:
  command:
    description: plan o apply.
    required: true
  working_directory:
    description: Directorio Terraform relativo al checkout del caller.
    required: true
  state_name:
    description: >
      Nombre bajo /opt/andes/terraform-state/<state_name>.
      Ejemplo cloudflare, vsphere, secrets-manager.
    required: true
  terraform_version:
    description: Versión de Terraform a bajar.
    required: false
    default: "1.17.2"
  infisical_env_file:
    description: Dotenv con INFISICAL_UNIVERSAL_AUTH_* (y PROJECT_ID si aplica).
    required: true
  require_existing_state:
    description: Si true, el tfstate tiene que existir y no estar vacío (vsphere).
    required: false
    default: "false"
  export_project_id:
    description: Si true, exige INFISICAL_PROJECT_ID y lo exporta como TF_VAR_infisical_project_id.
    required: false
    default: "true"
  install_sops:
    description: Si true, baja sops al PATH del job.
    required: false
    default: "false"
  sops_version:
    description: Versión de sops (solo con install_sops).
    required: false
    default: "3.13.3"
  pre_script:
    description: Script del caller a correr antes de init (ruta relativa al checkout). Vacío = skip.
    required: false
    default: ""
  post_apply_script:
    description: Script del caller a correr después de apply (ruta relativa al checkout). Vacío = skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Terraform CI
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        STATE_NAME: ${{ inputs.state_name }}
        TERRAFORM_VERSION: ${{ inputs.terraform_version }}
        INFISICAL_ENV_FILE: ${{ inputs.infisical_env_file }}
        REQUIRE_EXISTING_STATE: ${{ inputs.require_existing_state }}
        EXPORT_PROJECT_ID: ${{ inputs.export_project_id }}
        INSTALL_SOPS: ${{ inputs.install_sops }}
        SOPS_VERSION: ${{ inputs.sops_version }}
        PRE_SCRIPT: ${{ inputs.pre_script }}
        POST_APPLY_SCRIPT: ${{ inputs.post_apply_script }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: bash --noprofile --norc -euo pipefail "${{ github.action_path }}/run.sh"
